name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test-python:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Test
      run: |
        uv run python -m unittest

  typecheck:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Typecheck
      run: |
        uv run mypy

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Lint
      run: |
        uv run ruff check
    - name: Check the formatting
      run: |
        uv run ruff format --check

  test-python-sdist:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Test
      run: |
        uv run make test-sdist
    - name: Check the package description
      run: |
        uvx twine check --strict dist/*.tar.gz

  examples:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync
    - name: Build the compiler, which the examples use
      run: |
        cargo build --locked --bin asnkitcc
    - name: Test
      run: |
        export PATH="$PWD/target/debug:$PATH"
        uv run python examples/compact_extensions_uper/main.py
        uv run python examples/programming_types/main.py
