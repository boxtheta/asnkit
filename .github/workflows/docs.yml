name: Documentation

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  # The documentation is built with MkDocs, and any warning is an error.
  build-docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build
      run: |
        uv run --group docs mkdocs build --strict
