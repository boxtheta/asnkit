name: X.509 interoperability

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  # Both runtimes, with and without the mappings of ANY DEFINED BY, read
  # and write X.509 as OpenSSL, cryptography, asn1crypto and pyasn1 do,
  # with what the compiler makes now. See tests/test_x509_interop.py.
  x509-interop:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync --group interop
    - name: Build the compiler
      run: |
        cargo build --locked --release --bin asnkitcc
    - name: Test
      run: |
        openssl version
        ASNKITCC="$PWD/target/release/asnkitcc" ASNKIT_INTEROP_REQUIRED=1 \
          uv run --group interop python -m unittest -v tests.test_x509_interop
