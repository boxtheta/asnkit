# The code the plugin makes for each specification of tests/vectors,
# held to the vectors of BER, DER and UPER: see src/lib.rs. It is not a
# member of the workspace, as build.rs makes the code with the plugin.
[package]
name = "codec-vectors"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
asnkitrt = { path = "../../../asnkitrt-rs" }

[dev-dependencies]
flate2 = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[build-dependencies]
asnkit-gen-rust-codec = { path = "../.." }

[workspace]
