[project]
name = "asnkitrt"
version = "2.0.0rc3"
description = "Encode and decode ASN.1 with compiled specifications"
readme = "README.rst"
authors = [
    { name = "xadaemon", email = "mxavier@boxtheta.com" }
]
requires-python = ">=3.13"
dependencies = []
license = "MIT"
license-files = ["LICENSE-RUNTIMES", "NOTICE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# To load signed and encrypted .asni files. Nothing else needs it.
signing = [
    "cryptography>=43",
]
encryption = [
    "cryptography>=43",
]

[project.urls]
source = "https://github.com/boxtheta/asnkit"

[build-system]
requires = ["uv_build>=0.9.10,<0.13.0"]
build-backend = "uv_build"
