[package]
name = "asnkit-compiler-wasm"
version = "2.0.0-rc1"
edition = "2024"
rust-version = "1.88"
description = "The compiler of asnkit for the web and JavaScript, as WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/boxtheta/asnkit"
readme = "README.md"
# It is to be published on npm, as packages/asnkit-compiler-wasm/package.json says.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asnkit-compiler = { path = "../asnkit-compiler" }
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
