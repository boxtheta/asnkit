# The code of the plugin for a device: built for a target that has no
# std, to see that what the option no_std=true makes needs none. This is
# not a member of the workspace.
[package]
name = "no-std-check"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
asnkitrt = { path = "../../../asnkitrt-rs", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[workspace]
