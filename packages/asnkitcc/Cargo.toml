[package]
name = "asnkitcc"
version = "2.0.0-rc6"
edition = "2024"
description = "The command that compiles ASN.1 to the files asnkit loads, and runs its plugins"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/boxtheta/asnkit"
readme = "README.md"
keywords = ["asn1", "compiler", "ber", "der", "per"]
categories = ["command-line-utilities", "encoding"]

# The library is what asnkit-compiler-wasm shares with the command: the
# schemas, which it makes in the browser.
[lib]
path = "src/lib.rs"

[[bin]]
name = "asnkitcc"
path = "src/main.rs"

[dependencies]
asnkit-compiler = { version = "2.0.0-rc6", path = "../asnkit-compiler" }
asnkitrt = { version = "2.0.0-rc6", path = "../asnkitrt-rs", default-features = false, features = ["std", "jer", "xer", "gser", "bigint"] }

[dev-dependencies]
tempfile = "3"
