# The Rust crates of this repository. The Python packages are in the
# workspace of pyproject.toml.
[workspace]
resolver = "3"
members = ["packages/asnkit-compiler", "packages/asnkit-compiler-wasm", "packages/asnkit-gen-rust", "packages/asnkit-gen-rust-codec", "packages/asnkitcc", "packages/asnkitrt-c", "packages/asnkitrt-rs", "packages/asnkitrt-wasm"]

# Release, with the symbols a profiler needs to name the functions, as
# `packages/asnkitrt-rs/examples/profile.py` builds with.
[profile.profiling]
inherits = "release"
debug = true

# The runtime for the web, as WebAssembly, which is to be small to send.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
